<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Préparer le budget</title><rect width="1200" height="630" fill="#f3f1eb"/><rect width="1200" height="22" fill="#eb761f"/><g font-family="Arial,sans-serif"><text x="70" y="93" font-size="28" font-weight="700" fill="#be5713">WANGLI · GUIDE D’ACHAT</text><text x="70" y="158" font-size="42" font-weight="700" fill="#153148">Quel budget jusqu’à destination ?</text><text x="70" y="204" font-size="25" fill="#405766">Du prix aux frais à confirmer.</text><g fill="#fff"><rect x="70" y="255" width="510" height="130" rx="12"/><rect x="620" y="255" width="510" height="130" rx="12"/><rect x="70" y="410" width="510" height="130" rx="12"/><rect x="620" y="410" width="510" height="130" rx="12"/></g><g font-size="26" font-weight="700" fill="#153148"><text x="96" y="300">1 · OFFRE</text><text x="646" y="300">2 · TRAJET</text><text x="96" y="455">3 · COÛTS</text><text x="646" y="455">4 · VÉRIFIER</text></g><g font-size="21" fill="#405766"><text x="96" y="339">Modèle et prestations</text><text x="646" y="339">Lieu et responsabilités</text><text x="96" y="494">Postes et inconnus</text><text x="646" y="494">Hypothèses et devis</text></g><text x="70" y="586" font-size="21" fill="#405766">Les coûts restent à confirmer pour chaque projet.</text></g></svg>
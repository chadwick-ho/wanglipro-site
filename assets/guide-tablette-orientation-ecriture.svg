<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">Orientation de la tablette</title><desc id="desc">Besoin, modèle, essai et commande.</desc><rect width="720" height="1080" fill="#f3f1eb"/><rect width="720" height="18" fill="#eb761f"/><g font-family="Arial,sans-serif"><text x="45" y="75" font-size="26" font-weight="700" fill="#be5713">WANGLI · GUIDE D’ACHAT</text><text x="45" y="132" font-size="38" font-weight="700" fill="#153148">Tablette écritoire</text><text x="45" y="180" font-size="38" font-weight="700" fill="#153148">quelle orientation ?</text><g fill="#fff"><rect x="45" y="225" width="630" height="170" rx="12"/><rect x="45" y="420" width="630" height="170" rx="12"/><rect x="45" y="615" width="630" height="170" rx="12"/><rect x="45" y="810" width="630" height="170" rx="12"/></g><g font-weight="700" font-size="34" fill="#153148"><text x="72" y="284">1 · BESOIN</text><text x="72" y="479">2 · MODÈLES</text><text x="72" y="674">3 · ESSAI</text><text x="72" y="869">4 · COMMANDE</text></g><g font-size="29" fill="#405766"><text x="72" y="341">Utilisateurs et usages</text><text x="72" y="536">Orientations proposées</text><text x="72" y="731">Accès et écriture</text><text x="72" y="926">Quantités par configuration</text></g><text x="45" y="1035" font-size="25" fill="#405766">À confirmer pour chaque modèle.</text></g></svg>

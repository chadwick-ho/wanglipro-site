<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Préparer le contrôle du lot</title><rect width="1200" height="630" fill="#f3f1eb"/><rect width="1200" height="22" fill="#eb761f"/><g font-family="Arial,sans-serif"><text x="70" y="93" font-size="28" font-weight="700" fill="#be5713">WANGLI · GUIDE D’ACHAT</text><text x="70" y="158" font-size="42" font-weight="700" fill="#153148">Avant expédition : que contrôler ?</text><text x="70" y="204" font-size="25" fill="#405766">De la référence approuvée aux réserves.</text><g fill="#fff"><rect x="70" y="255" width="510" height="130" rx="12"/><rect x="620" y="255" width="510" height="130" rx="12"/><rect x="70" y="410" width="510" height="130" rx="12"/><rect x="620" y="410" width="510" height="130" rx="12"/></g><g font-size="26" font-weight="700" fill="#153148"><text x="96" y="300">1 · RÉFÉRENCE</text><text x="646" y="300">2 · PÉRIMÈTRE</text><text x="96" y="455">3 · CONSTAT</text><text x="646" y="455">4 · DÉCISION</text></g><g font-size="21" fill="#405766"><text x="96" y="339">Modèle et documents</text><text x="646" y="339">Lot et points à examiner</text><text x="96" y="494">Observations et écarts</text><text x="646" y="494">Traitement des réserves</text></g><text x="70" y="586" font-size="21" fill="#405766">Les modalités sont à confirmer pour chaque projet.</text></g></svg>
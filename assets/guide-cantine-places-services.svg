<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Prévoir les places par service</title><rect width="1200" height="630" fill="#f3f1eb"/><rect width="1200" height="22" fill="#eb761f"/><g font-family="Arial,sans-serif"><text x="70" y="93" font-size="28" font-weight="700" fill="#be5713">WANGLI · GUIDE D’ACHAT</text><text x="70" y="158" font-size="42" font-weight="700" fill="#153148">Cantine : combien de places par service ?</text><text x="70" y="204" font-size="25" fill="#405766">Du nombre de convives au plan de la salle.</text><g fill="#fff"><rect x="70" y="255" width="510" height="130" rx="12"/><rect x="620" y="255" width="510" height="130" rx="12"/><rect x="70" y="410" width="510" height="130" rx="12"/><rect x="620" y="410" width="510" height="130" rx="12"/></g><g font-size="26" font-weight="700" fill="#153148"><text x="96" y="300">1 · REPAS</text><text x="646" y="300">2 · PLACES</text><text x="96" y="455">3 · PLAN</text><text x="646" y="455">4 · VALIDATION</text></g><g font-size="21" fill="#405766"><text x="96" y="339">Convives par service</text><text x="646" y="339">Besoins simultanés</text><text x="96" y="494">Tables et circulations</text><text x="646" y="494">Décision de l’établissement</text></g><text x="70" y="586" font-size="21" fill="#405766">Les chiffres et l’implantation sont à confirmer pour chaque projet.</text></g></svg>
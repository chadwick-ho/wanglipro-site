<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Préparer les besoins de hauteur</title><rect width="1200" height="630" fill="#f3f1eb"/><rect width="1200" height="22" fill="#eb761f"/><g font-family="Arial,sans-serif"><text x="70" y="93" font-size="28" font-weight="700" fill="#be5713">WANGLI · GUIDE D’ACHAT</text><text x="70" y="158" font-size="43" font-weight="700" fill="#153148">Quelle hauteur pour quel groupe ?</text><text x="70" y="204" font-size="25" fill="#405766">Préparer les besoins avant de choisir une configuration.</text><g fill="#fff"><rect x="70" y="255" width="510" height="130" rx="12"/><rect x="620" y="255" width="510" height="130" rx="12"/><rect x="70" y="410" width="510" height="130" rx="12"/><rect x="620" y="410" width="510" height="130" rx="12"/></g><g font-size="26" font-weight="700" fill="#153148"><text x="96" y="300">1 · GROUPES</text><text x="646" y="300">2 · BESOINS</text><text x="96" y="455">3 · RÉFÉRENCES</text><text x="646" y="455">4 · EXAMEN</text></g><g font-size="21" fill="#405766"><text x="96" y="339">Classes et usages prévus</text><text x="646" y="339">Exigences du projet</text><text x="96" y="494">Hauteurs de table et d’assise</text><text x="646" y="494">Avis des personnes compétentes</text></g><text x="70" y="586" font-size="21" fill="#405766">Une tranche d’âge ne détermine pas une dimension universelle.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Vérifier une version avant la commande</title><desc id="desc">Quatre étapes : réunir les documents, comparer les références, confirmer les écarts et conserver la version validée.</desc><rect width="1200" height="630" fill="#f3f1eb"/><rect width="1200" height="22" fill="#eb761f"/><text x="70" y="93" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#be5713">WANGLI · GUIDE D’ACHAT</text><text x="70" y="158" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#153148">Spécifications : quelle version valider ?</text><text x="70" y="204" font-family="Arial,sans-serif" font-size="25" fill="#405766">Avant la commande, reliez les documents à une décision écrite.</text><g font-family="Arial,sans-serif"><rect x="70" y="255" width="510" height="130" rx="12" fill="#fff"/><rect x="620" y="255" width="510" height="130" rx="12" fill="#fff"/><rect x="70" y="410" width="510" height="130" rx="12" fill="#fff"/><rect x="620" y="410" width="510" height="130" rx="12" fill="#fff"/><g font-size="26" font-weight="700" fill="#153148"><text x="96" y="300">1 · RÉUNIR</text><text x="646" y="300">2 · COMPARER</text><text x="96" y="455">3 · CONFIRMER</text><text x="646" y="455">4 · CONSERVER</text></g><g font-size="21" fill="#405766"><text x="96" y="339">Devis, plans, fiche technique</text><text x="646" y="339">Références, quantités, écarts</text><text x="96" y="494">Décision de la personne habilitée</text><text x="646" y="494">Versions et date de l’accord</text></g></g><text x="70" y="586" font-family="Arial,sans-serif" font-size="21" fill="#405766">Un point ouvert ? Il reste à confirmer avant la commande.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Préparer le nettoyage</title><rect width="1200" height="630" fill="#f3f1eb"/><rect width="1200" height="22" fill="#eb761f"/><g font-family="Arial,sans-serif"><text x="70" y="93" font-size="28" font-weight="700" fill="#be5713">WANGLI · GUIDE D’ACHAT</text><text x="70" y="158" font-size="42" font-weight="700" fill="#153148">Comment préparer le nettoyage ?</text><text x="70" y="204" font-size="25" fill="#405766">Des usages aux instructions à confirmer.</text><g fill="#fff"><rect x="70" y="255" width="510" height="130" rx="12"/><rect x="620" y="255" width="510" height="130" rx="12"/><rect x="70" y="410" width="510" height="130" rx="12"/><rect x="620" y="410" width="510" height="130" rx="12"/></g><g font-size="26" font-weight="700" fill="#153148"><text x="96" y="300">1 · USAGE</text><text x="646" y="300">2 · PROCÉDURE</text><text x="96" y="455">3 · MODÈLE</text><text x="646" y="455">4 · DÉCISION</text></g><g font-size="21" fill="#405766"><text x="96" y="339">Surfaces et activités</text><text x="646" y="339">Méthodes validées</text><text x="96" y="494">Matériaux et notice</text><text x="646" y="494">Écarts à clarifier</text></g><text x="70" y="586" font-size="21" fill="#405766">Les méthodes restent à confirmer pour chaque matériau.</text></g></svg>
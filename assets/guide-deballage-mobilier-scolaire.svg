<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">Organiser le déballage</title><desc id="desc">Zone, contrôle, emballages et remise.</desc><rect width="720" height="1080" fill="#f3f1eb"/><rect width="720" height="18" fill="#eb761f"/><g font-family="Arial,sans-serif"><text x="45" y="75" font-size="26" font-weight="700" fill="#be5713">WANGLI · GUIDE D’ACHAT</text><text x="45" y="132" font-size="38" font-weight="700" fill="#153148">Du colis à la salle</text><text x="45" y="180" font-size="38" font-weight="700" fill="#153148">quatre étapes à prévoir</text><g fill="#fff"><rect x="45" y="225" width="630" height="170" rx="12"/><rect x="45" y="420" width="630" height="170" rx="12"/><rect x="45" y="615" width="630" height="170" rx="12"/><rect x="45" y="810" width="630" height="170" rx="12"/></g><g font-weight="700" font-size="34" fill="#153148"><text x="72" y="284">1 · ZONE</text><text x="72" y="479">2 · CONTRÔLE</text><text x="72" y="674">3 · EMBALLAGES</text><text x="72" y="869">4 · REMISE</text></g><g font-size="29" fill="#405766"><text x="72" y="341">Espace et circulation</text><text x="72" y="536">Pièces et justificatifs</text><text x="72" y="731">Collecte et destination</text><text x="72" y="926">Salle dégagée</text></g><text x="45" y="1035" font-size="25" fill="#405766">Responsabilités à confirmer.</text></g></svg>

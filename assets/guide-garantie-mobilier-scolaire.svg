<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">Que demander sur la garantie ?</title><desc id="desc">Périmètre, durée, démarche et frais à clarifier avant la commande.</desc><rect width="720" height="1080" fill="#f3f1eb"/><rect width="720" height="18" fill="#eb761f"/><g font-family="Arial,sans-serif"><text x="45" y="75" font-size="26" font-weight="700" fill="#be5713">WANGLI · GUIDE D’ACHAT</text><text x="45" y="132" font-size="38" font-weight="700" fill="#153148">Que demander sur</text><text x="45" y="180" font-size="38" font-weight="700" fill="#153148">la garantie ?</text><g fill="#fff"><rect x="45" y="225" width="630" height="170" rx="12"/><rect x="45" y="420" width="630" height="170" rx="12"/><rect x="45" y="615" width="630" height="170" rx="12"/><rect x="45" y="810" width="630" height="170" rx="12"/></g><g font-weight="700" font-size="34" fill="#153148"><text x="72" y="284">1 · PÉRIMÈTRE</text><text x="72" y="479">2 · DURÉE</text><text x="72" y="674">3 · DÉMARCHE</text><text x="72" y="869">4 · FRAIS</text></g><g font-size="29" fill="#405766"><text x="72" y="341">Modèles et défauts couverts</text><text x="72" y="536">Début et fin de couverture</text><text x="72" y="731">Contact et signalement</text><text x="72" y="926">Pièces, réparation, transport</text></g><text x="45" y="1035" font-size="25" fill="#405766">Conditions à confirmer par écrit.</text></g></svg>

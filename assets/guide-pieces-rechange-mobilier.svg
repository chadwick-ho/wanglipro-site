<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Préparer les pièces de rechange</title><rect width="1200" height="630" fill="#f3f1eb"/><rect width="1200" height="22" fill="#eb761f"/><g font-family="Arial,sans-serif"><text x="70" y="93" font-size="28" font-weight="700" fill="#be5713">WANGLI · GUIDE D’ACHAT</text><text x="70" y="158" font-size="42" font-weight="700" fill="#153148">Quelles pièces prévoir pour le mobilier ?</text><text x="70" y="204" font-size="25" fill="#405766">Identifier les pièces et confirmer les conditions.</text><g fill="#fff"><rect x="70" y="255" width="510" height="130" rx="12"/><rect x="620" y="255" width="510" height="130" rx="12"/><rect x="70" y="410" width="510" height="130" rx="12"/><rect x="620" y="410" width="510" height="130" rx="12"/></g><g font-size="26" font-weight="700" fill="#153148"><text x="96" y="300">1 · IDENTIFIER</text><text x="646" y="300">2 · PRIORISER</text><text x="96" y="455">3 · CONSULTER</text><text x="646" y="455">4 · DÉCIDER</text></g><g font-size="21" fill="#405766"><text x="96" y="339">Modèle et version</text><text x="646" y="339">Besoins d’entretien</text><text x="96" y="494">Compatibilité et disponibilité</text><text x="646" y="494">Réponses et points ouverts</text></g><text x="70" y="586" font-size="21" fill="#405766">Les conditions sont à confirmer pour chaque modèle.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">Stockage temporaire du mobilier</title><desc id="desc">Lieu, colis, organisation et suivi.</desc><rect width="720" height="1080" fill="#f3f1eb"/><rect width="720" height="18" fill="#eb761f"/><g font-family="Arial,sans-serif"><text x="45" y="75" font-size="26" font-weight="700" fill="#be5713">WANGLI · GUIDE D’ACHAT</text><text x="45" y="132" font-size="38" font-weight="700" fill="#153148">Stocker le mobilier</text><text x="45" y="180" font-size="38" font-weight="700" fill="#153148">avant installation</text><g fill="#fff"><rect x="45" y="225" width="630" height="170" rx="12"/><rect x="45" y="420" width="630" height="170" rx="12"/><rect x="45" y="615" width="630" height="170" rx="12"/><rect x="45" y="810" width="630" height="170" rx="12"/></g><g font-weight="700" font-size="34" fill="#153148"><text x="72" y="284">1 · LIEU</text><text x="72" y="479">2 · COLIS</text><text x="72" y="674">3 · ORGANISATION</text><text x="72" y="869">4 · SUIVI</text></g><g font-size="29" fill="#405766"><text x="72" y="341">Local et accès</text><text x="72" y="536">Dimensions et consignes</text><text x="72" y="731">Zones et passages</text><text x="72" y="926">Contrôles jusqu’à la sortie</text></g><text x="45" y="1035" font-size="25" fill="#405766">Conditions à confirmer par projet.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Vérifier les passages du mobilier scolaire</title><rect width="1200" height="630" fill="#f3f1eb"/><rect width="1200" height="22" fill="#eb761f"/><g font-family="Arial,sans-serif"><text x="70" y="93" font-size="28" font-weight="700" fill="#be5713">WANGLI · GUIDE D’ACHAT</text><text x="70" y="158" font-size="43" font-weight="700" fill="#153148">Le meuble peut-il rejoindre la salle ?</text><text x="70" y="204" font-size="25" fill="#405766">À vérifier avec l’établissement et les intervenants.</text><g fill="#fff"><rect x="70" y="255" width="510" height="130" rx="12"/><rect x="620" y="255" width="510" height="130" rx="12"/><rect x="70" y="410" width="510" height="130" rx="12"/><rect x="620" y="410" width="510" height="130" rx="12"/></g><g font-size="26" font-weight="700" fill="#153148"><text x="96" y="300">1 · TRACER</text><text x="646" y="300">2 · RELEVER</text><text x="96" y="455">3 · COMPARER</text><text x="646" y="455">4 · CONFIRMER</text></g><g font-size="21" fill="#405766"><text x="96" y="339">De la réception jusqu’à la salle</text><text x="646" y="339">Portes, couloirs et obstacles</text><text x="96" y="494">Dimensions et état du meuble</text><text x="646" y="494">Méthode et responsabilités</text></g><text x="70" y="586" font-size="21" fill="#405766">Un seul passage mesuré ne suffit pas à valider le parcours.</text></g></svg>